name: Release

# A version tag publishes the wheel, web app inside, as a GitHub release.
# Consumers pin the wheel's URL and install the page as built.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  wheel:
    name: Build the wheel and publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version comes from the tag; hatch-vcs reads it from history.
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webxr/package-lock.json
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"
      - name: Build the wheel
        run: uv build --wheel
      - name: Check the built page is inside
        run: unzip -l dist/*.whl | grep -q "teleop_xr/dist/_next/"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.whl --title "${{ github.ref_name }}" --generate-notes
